<!DOCTYPE html>
<html>
    <head>
        <style>
            .flex-container{
                display: flex;
                flex-wrap: nowrap;
                background-color: dodgerblue;
            }

            .flex-container .box{
                background-color: #f1f1f1;
                width: 50%;
                margin: 10px;
                text-align: center;
                line-height: 75px;
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <h1>Flexible boxes</h1>
        <div class="flex-container">
            <div class="box">Box 1 - This is some text to make sure that the content gets really tall. This is some text to make sure the contect gets really really tall.</div>
            <div class="box">Box 2 - My height will follow Box 1.</div>
        </div>
        <p>try to resize the browser window to see the flexible layout.</p>

    </body>
</html>
